apiVersion: edgecitadel.io/v1alpha1
kind: AgentPlugin

metadata:
  name: echo
  displayName: Echo Agent
  description: A minimal working agent that proves registration, heartbeat, inbox, and result delivery.
  version: 0.1.1
  publisher: edgecitadel

compatibility:
  supervisorApi: ">=0.1.0,<0.2.0"
  protocols: [edgecitadel.plugin.v1]

runtime:
  command: [python, -m, runtime]
  healthTimeoutSeconds: 15
  restartPolicy: on-failure

skills:
  directory: skills

agents:
  - id: echo-agent
    skillNames: [echo]
    listensBroadcast: false

permissions:
  knowledge: []
  messaging:
    outboundAgents: [aggregator]
  network:
    outbound: []
  devices: []

security:
  sandbox: restricted
  secrets: []

extensions: {}
