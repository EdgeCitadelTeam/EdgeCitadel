apiVersion: edgecitadel.io/v1alpha2
kind: ManagedAgent

metadata:
  name: placeholder
  displayName: Placeholder Managed Agent
  description: Demonstrates the EdgeCitadel Managed Agent package contract.
  version: 0.2.0
  publisher: local

compatibility:
  supervisorApi: ">=0.1.0,<0.2.0"
  protocols:
    - edgecitadel.managed-agent.v1

runtime:
  kind: agent_runtime
  command: [python, -m, runtime]
  healthTimeoutSeconds: 10
  restartPolicy: on-failure

skills:
  directory: skills

agents:
  - id: placeholder-agent
    skillNames: [placeholder]
    listensBroadcast: false

permissions:
  knowledge: []
  messaging:
    outboundAgents: []
  network:
    outbound: []
  devices: []

security:
  sandbox: restricted
  secrets: []

extensions: {}
