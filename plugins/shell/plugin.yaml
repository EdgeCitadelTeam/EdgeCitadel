apiVersion: edgecitadel.io/v1alpha1
kind: AgentPlugin

metadata:
  name: shell
  displayName: Shell Agent
  description: Executes explicitly approved shell commands on the Edge host.
  version: 0.1.0
  publisher: edgecitadel

compatibility:
  supervisorApi: ">=0.1.0,<0.2.0"
  protocols: [edgecitadel.plugin.v1]

runtime:
  command: [python, -m, edgecitadel_shell_plugin]
  pythonRequirements: edgecitadel_shell_plugin/requirements.txt
  healthTimeoutSeconds: 15
  restartPolicy: on-failure

skills:
  directory: skills

agents:
  - id: shell-1
    skillNames: [shell-exec]
    listensBroadcast: false

permissions:
  knowledge: []
  messaging:
    outboundAgents: [aggregator]
  network:
    outbound: []
  devices: [host-shell]

security:
  sandbox: unrestricted
  secrets: []

extensions: {}
