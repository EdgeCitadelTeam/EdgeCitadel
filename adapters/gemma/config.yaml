agent_id: gemma-1
name: gemma-1
description: Gemma reasoner with multi-skill dispatch, memory, and streaming.
version: 0.2.5
runtime:
  kind: native
  roles: [reasoner]
  heartbeat_interval_sec: 30
capabilities:
  streaming: true
skills:
  - id: reasoning.chat
    name: gemma-reasoner
    description: Send a free-text prompt; receive the model's full response.
    tags: [chat, reasoning]
    system_prompt: |
      You are Gemma, a helpful assistant. Respond in plain text.
    defaults: { temperature: 0.7 }
    output_shape: free_text
  - id: text.summarize
    name: gemma-summarizer
    description: Summarise the input text in 2-3 sentences.
    tags: [text, summarization]
    system_prompt: |
      Summarise the user's text in 2-3 sentences. Be precise and faithful;
      do not add information not in the source.
    defaults: { temperature: 0.3 }
    output_shape: free_text
  - id: text.classify
    name: gemma-classifier
    description: Classify the input text into one of the provided categories.
    tags: [text, classification]
    system_prompt: |
      Classify the user's text. Return only valid JSON matching the schema:
      {"label": "<category>", "confidence": <float 0..1>}.
    defaults: { temperature: 0.1 }
    output_shape:
      type: json
      schema:
        type: object
        required: [label, confidence]
        properties:
          label:      { type: string }
          confidence: { type: number, minimum: 0, maximum: 1 }
  - id: code.explain
    name: gemma-code-explainer
    description: Explain what the provided code does, line by line where useful.
    tags: [code, explanation]
    system_prompt: |
      Explain the user's code clearly. Identify language, summarise purpose,
      then walk through the non-obvious lines.
    defaults: { temperature: 0.3 }
    output_shape: free_text
