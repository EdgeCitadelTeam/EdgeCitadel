services:
  nats:
    image: nats:2.10-alpine
    command: ["--jetstream", "--store_dir", "/data", "-p", "4222", "--http_port", "8222", "--auth", "${NATS_TOKEN:-changeme}"]
    ports:
      - "4222:4222"
      - "8222:8222"  # monitoring
    volumes:
      - ./nats/data:/data
    restart: unless-stopped

  aggregator:
    build: ./aggregator
    restart: unless-stopped
    volumes:
      - ./data:/data
    environment:
      - DB_PATH=/data/openclaw.db
      - API_KEY=${OPENCLAW_API_KEY}
      - NATS_URL=nats://${NATS_TOKEN:-changeme}@nats:4222
    expose:
      - "8000"
    depends_on:
      - nats

  dashboard:
    build: ./frontend
    restart: unless-stopped
    expose:
      - "80"

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - aggregator
      - dashboard
