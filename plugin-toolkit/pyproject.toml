[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "edgecitadel-plugin-toolkit"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "cryptography>=46,<51",
  "jsonschema[format]>=4.23,<5",
  "nats-py>=2.9,<3",
  "packaging>=24,<26",
  "PyYAML>=6,<7",
]

[project.optional-dependencies]
test = [
  "httpx>=0.27,<1",
  "pillow>=10,<13",
  "pytest>=8,<9",
  "pytest-asyncio>=0.24,<2",
  "respx>=0.21,<1",
]
type = ["mypy>=1.13,<2", "types-jsonschema>=4.23,<5"]

[project.scripts]
edgecitadel-supervisor = "edgecitadel_supervisor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
edgecitadel_plugin_sdk = ["py.typed"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
