server {
    listen 80;

    location /api/ {
        # No trailing slash on proxy_pass — preserves the /api/ prefix
        # so it reaches FastAPI routes registered at /api/...
        proxy_pass         http://aggregator:8000;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $remote_addr;
    }

    location /ws {
        proxy_pass             http://aggregator:8000/ws;
        proxy_http_version     1.1;
        proxy_set_header       Upgrade $http_upgrade;
        proxy_set_header       Connection "Upgrade";
        proxy_set_header       Host $host;
        proxy_read_timeout     86400;
    }

    location /ws/stream {
        proxy_pass             http://aggregator:8000/ws/stream;
        proxy_http_version     1.1;
        proxy_set_header       Upgrade $http_upgrade;
        proxy_set_header       Connection "Upgrade";
        proxy_set_header       Host $host;
        proxy_read_timeout     86400;
    }

    location /ws/agent/ {
        proxy_pass             http://aggregator:8000/ws/agent/;
        proxy_http_version     1.1;
        proxy_set_header       Upgrade $http_upgrade;
        proxy_set_header       Connection "Upgrade";
        proxy_set_header       Host $host;
        proxy_read_timeout     86400;
    }

    location / {
        proxy_pass         http://dashboard:80;
        proxy_set_header   Host $host;
    }
}
