name: Publish to PyPI

on:
  release:
    types: [published]

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out release
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Verify release tag matches package version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          package_version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          test "$RELEASE_TAG" = "v$package_version"

      - name: Build and validate distributions
        run: |
          python -m pip install --disable-pip-version-check build "twine>=7"
          python -m build
          python -m twine check dist/*

      - name: Smoke test installed wheel
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python -m venv /tmp/edgecitadel-wheel-smoke
          /tmp/edgecitadel-wheel-smoke/bin/python -m pip install --disable-pip-version-check dist/*.whl
          test "$(/tmp/edgecitadel-wheel-smoke/bin/edgecitadel --version)" = "edgecitadel ${RELEASE_TAG#v}"
          /tmp/edgecitadel-wheel-smoke/bin/edgecitadel install --help | grep -q -- '--messaging-mode'
          test -f /tmp/edgecitadel-wheel-smoke/share/edgecitadel/plugins/plugins/edgecitadel/.mcp.json
          test -f /tmp/edgecitadel-wheel-smoke/share/edgecitadel/scripts/edgecitadel_cli.py

      - name: Upload distributions
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish distributions
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/edgecitadel
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: python-distributions
          path: dist/

      - name: Publish distributions to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
