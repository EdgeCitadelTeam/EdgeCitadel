name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r scripts/requirements-test.txt
      - run: python -m pip install -e 'agent-platform[test]'
      - run: ruff check --target-version py312 aggregator/ scripts/ agent-platform/ agent-packages/ tests/ deploy/tests/ e2e/fixture_agent/
      - run: ruff format --target-version py312 aggregator/ scripts/ agent-platform/ agent-packages/ tests/ deploy/tests/ e2e/fixture_agent/ --check
      - run: python -m pytest -q tests scripts/tests deploy/tests schemas/tests
      - run: python -m pytest -q agent-platform/tests
      - run: python -m build

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
