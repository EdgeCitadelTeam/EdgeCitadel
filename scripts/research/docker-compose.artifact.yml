name: ${COMPOSE_PROJECT_NAME:?}

x-owner-labels: &owner-labels
  ai.edgecitadel.owner: artifact
  ai.edgecitadel.run-id: ${EC_RUN_ID:?}

x-artifact-service: &artifact-service
  image: ${EC_ARTIFACT_IMAGE:-edgecitadel-research-artifact:local}
  labels: *owner-labels
  networks:
    - artifact
  volumes:
    - ${EC_CREDENTIAL_FILE:?}:/run/edgecitadel/transport-token:ro
    - ${EC_CONFIG_DIR:?}:/run/edgecitadel/config:ro
    - ${EC_CONTROL_DIR:?}:/control
    - ${EC_STATE_DIR:?}:/state
    - ${EC_OUTPUT_DIR:?}:/output
    - topology-metadata:/topology-metadata

services:
  nats:
    image: nats@sha256:b83efabe3e7def1e0a4a31ec6e078999bb17c80363f881df35edc70fcb6bb927
    entrypoint:
      - /bin/sh
      - -ec
      - token="$$(cat /run/edgecitadel/transport-token)"; config="$$(mktemp)"; sed "s/@NATS_TOKEN@/$$token/g" "$$EC_NATS_CONFIG" > "$$config"; exec nats-server -c "$$config"
    environment:
      EC_NATS_CONFIG: ${EC_NATS_CONFIG:?}
    labels: *owner-labels
    networks:
      - artifact
    volumes:
      - ./configs/nats/core.conf:/etc/nats/core.conf:ro
      - ./configs/nats/jetstream.conf:/etc/nats/jetstream.conf:ro
      - ${EC_CREDENTIAL_FILE:?}:/run/edgecitadel/transport-token:ro
      - ${EC_STATE_DIR:?}:/state
      - topology-metadata:/topology-metadata

  controller:
    <<: *artifact-service
    profiles: [central-relay, core-only, edgecitadel, all-durable]
    command:
      - /bin/sh
      - -ec
      - if [ "$$EC_MODE" = central-relay ]; then export RELAY_DB_PATH=/state/relay.sqlite; exec uvicorn scripts.research.modes.central_relay_server:create_app_from_environment --host 0.0.0.0 --port 8000; fi; exec sleep infinity
    environment:
      EC_CREDENTIAL_FILE: /run/edgecitadel/transport-token
      EC_MODE: ${EC_MODE:?}
      EC_RUN_ID: ${EC_RUN_ID:?}

  native-control:
    <<: *artifact-service
    profiles: [central-relay, core-only, edgecitadel, all-durable]
    command:
      - /bin/sh
      - -ec
      - exec python -m scripts.research.external_worker_supervisor --config /control/active-native-control.json --events /state/worker-events.jsonl --status /control/worker-status.txt
    environment:
      EC_CREDENTIAL_FILE: /run/edgecitadel/transport-token
      EC_MODE: ${EC_MODE:?}
      NATS_URL: nats://nats:4222
      RELAY_URL: http://controller:8000
    depends_on:
      nats:
        condition: service_started

  direct-observer:
    <<: *artifact-service
    profiles: [central-relay, core-only, edgecitadel, all-durable]
    cap_add:
      - NET_ADMIN
    command: [sleep, infinity]

  runner:
    <<: *artifact-service
    profiles: [central-relay, core-only, edgecitadel, all-durable]
    cap_add:
      - NET_ADMIN
    command: [sleep, infinity]
    environment:
      EC_CREDENTIAL_FILE: /run/edgecitadel/transport-token
      EC_MODE: ${EC_MODE:?}
      NATS_URL: nats://nats:4222
      RELAY_URL: http://controller:8000

networks:
  artifact:
    labels: *owner-labels

volumes:
  topology-metadata:
    labels: *owner-labels
