services:
  mqtt:
    image: eclipse-mosquitto:2
    ports:
      - "11883:1883"
    volumes:
      - ../mosquitto/config:/mosquitto/config:ro
    healthcheck:
      test: ["CMD", "mosquitto_sub", "-t", "$$SYS/#", "-C", "1", "-u", "iot_agent", "-P", "openclaw_secret", "-W", "3"]
      interval: 3s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ../aggregator
    ports:
      - "18000:8000"
    environment:
      - MQTT_HOST=mqtt
      - MQTT_PORT=1883
      - MQTT_USER=iot_agent
      - MQTT_PASS=openclaw_secret
      - DB_PATH=/data/openclaw.db
      - API_KEY=test-api-key
    volumes:
      - test-data:/data
    depends_on:
      mqtt:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 3s
      timeout: 5s
      retries: 15

  frontend:
    build:
      context: ../frontend
    ports:
      - "13000:80"
    volumes:
      - ./test-nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:80"]
      interval: 3s
      timeout: 5s
      retries: 15

volumes:
  test-data:
