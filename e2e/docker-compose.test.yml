services:
  nats:
    image: nats:2.10-alpine
    command: ["--jetstream", "--store_dir", "/data", "-p", "4222", "--http_port", "8222"]
    ports:
      - "14222:4222"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8222/healthz"]
      interval: 3s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ../aggregator
    ports:
      - "18000:8000"
    environment:
      - NATS_URL=nats://nats:4222
      - DB_PATH=/data/openclaw.db
      - API_KEY=test-api-key
      - HEARTBEAT_INTERVAL=2
      - HEARTBEAT_TIMEOUT=6
    volumes:
      - test-data:/data
    depends_on:
      nats:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 3s
      timeout: 5s
      retries: 15

  frontend:
    build:
      context: ../frontend
    ports:
      - "13000:80"
    volumes:
      - ./test-nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:80"]
      interval: 3s
      timeout: 5s
      retries: 15

volumes:
  test-data:
