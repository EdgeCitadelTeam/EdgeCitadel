services:
  nats:
    image: nats:2.10-alpine
    command: ["-c", "/etc/nats/nats.conf"]
    ports:
      - "14222:4222"
      - "11883:1883"
      - "18222:8222"
    volumes:
      - ./test-nats.conf:/etc/nats/nats.conf:ro
      - nats_test_data:/data
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8222/healthz"]
      interval: 3s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ../aggregator
    ports:
      - "18000:8000"
    environment:
      - NATS_URL=nats://nats:4222
      - DB_PATH=/data/openclaw.db
      # API_KEY retired in Phase 1 follow-ups: aggregator no longer reads
      # it; HTTP-level auth is a v0.2 design topic.
      - HEARTBEAT_INTERVAL=2
      - HEARTBEAT_TIMEOUT=6
    volumes:
      - test-data:/data
    depends_on:
      nats:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 3s
      timeout: 5s
      retries: 15

  frontend:
    build:
      context: ../frontend
    ports:
      - "13000:80"
    volumes:
      - ./test-nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:80"]
      interval: 3s
      timeout: 5s
      retries: 15

volumes:
  test-data:
  nats_test_data:
