services:
  nats:
    image: nats:2.10-alpine
    command: ["-c", "/etc/nats/nats.conf"]
    ports:
      - "14222:4222"
      - "18222:8222"
    environment:
      - NATS_TOKEN=${NATS_TOKEN:-test-token}
    volumes:
      - ./test-nats.conf:/etc/nats/nats.conf:ro
      - nats_test_data:/data
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8222/healthz"]
      interval: 3s
      timeout: 3s
      retries: 10

  backend:
    # Phase 1 follow-up: build context must be the repo root so the
    # Dockerfile can COPY both aggregator/ and schemas/ as package
    # subdirs (mirrors the production aggregator service).
    build:
      context: ..
      dockerfile: aggregator/Dockerfile
    ports:
      - "18000:8000"
    environment:
      - NATS_URL=nats://nats:4222
      - NATS_TOKEN=${NATS_TOKEN:-test-token}
      - DB_PATH=/data/openclaw.db
    volumes:
      - test-data:/data
    depends_on:
      nats:
        condition: service_healthy
    healthcheck:
      # Phase 1 retired the /health endpoint; /api/system/status returns
      # the canonical v0.1 shape (nats_connected, jetstream_stream_ok).
      test: ["CMD", "python", "-c", "import urllib.request,sys; r=urllib.request.urlopen('http://localhost:8000/api/system/status', timeout=2); sys.exit(0 if r.status==200 else 1)"]
      interval: 3s
      timeout: 5s
      retries: 15

  frontend:
    build:
      context: ../frontend
    ports:
      - "13000:80"
    volumes:
      - ./test-nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:80"]
      interval: 3s
      timeout: 5s
      retries: 15

volumes:
  test-data:
  nats_test_data:
