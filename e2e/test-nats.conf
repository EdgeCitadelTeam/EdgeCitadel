server_name: "test-edgecitadel"
listen: 0.0.0.0:4222
http_port: 8222

jetstream {
    # Test broker must offer >= the stream's max_bytes (1GB; see
    # aggregator/jetstream_bootstrap.py). Keeping it small enough to fit on
    # CI runners but large enough that the bootstrap doesn't fail with
    # err_code=10047 "insufficient storage resources available".
    store_dir: "/data/jetstream"
    max_mem: 256MB
    max_file: 2GB
}

# MQTT ingress is deploy-time opt-in (ADR-0004). The test stack mirrors
# the dev contract — MQTT off by default. Re-enable explicitly if a
# specific test needs MQTT ingress.

authorization {
    # v0.1: token-only auth (mirrors nats/nats.conf — see ADR-0005 for the
    # v0.2 per-session JWT plan that supersedes this).
    token: $NATS_TOKEN
}
